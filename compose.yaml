name: keys-local
services:
  app:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    restart: unless-stopped
    init: true
    environment:
      APP_MODE: ${APP_MODE:-demo}
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      DATA_DIR: /app/data
      TZ: ${TZ:-Europe/Moscow}
      SESSION_SECRET: ${SESSION_SECRET:-}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-}
      MAX_DEEPLINK_BASE: ${MAX_DEEPLINK_BASE:-https://max.ru}
      MAX_API_BASE: ${MAX_API_BASE:-https://platform-api2.max.ru}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      PRIVACY_URL: ${PRIVACY_URL:-}
      TERMS_URL: ${TERMS_URL:-}
    ports:
      - "127.0.0.1:${LOCAL_PORT:-3000}:3000"
    volumes:
      - data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  data:
