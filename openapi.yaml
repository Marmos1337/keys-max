  /api/profile/guide:
    post:
      summary: Сохранить прогресс знакомства с приложением
      description: >-
        Обновляет только прогресс текущего пользователя в указанном режиме.
        Число открытий монотонно растёт до 4, разделы объединяются, скрытие сохраняется.
        Другие настройки и активная роль не меняются. Повторный запрос безопасен.
      operationId: updateGuideProgress
      parameters:
      - in: header
        name: X-Keys-Client
        required: true
        schema: {type: string, const: miniapp}
      - in: header
        name: Idempotency-Key
        required: true
        schema: {type: string, minLength: 8, maxLength: 100}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, progress]
              properties:
                role: {type: string, enum: [owner, tenant]}
                progress:
                  type: object
                  required: [opens, topics, dismissed]
                  properties:
                    opens: {type: integer, minimum: 0, maximum: 4}
                    topics:
                      type: array
                      maxItems: 7
                      items:
                        type: string
                        enum: [apartments, documents, finances, requests, meters, purchases, visits]
                    dismissed: {type: boolean}
      responses:
        '200':
          description: Объединённый прогресс
          content:
            application/json:
              schema:
                type: object
                required: [role, progress]
                properties:
                  role: {type: string, enum: [owner, tenant]}
                  progress: {type: object}
        '400':
          description: Некорректное тело запроса
        '401':
          description: Требуется авторизация
        '403':
          description: Недопустимый Origin или клиент
        '409':
          description: Повторный ключ с иным содержимым
        '429':
          description: Превышен лимит запросов
  /api/apartments/{id}/deletion-preview:
    get:
      summary: Предварительная проверка удаления квартиры (только собственник)
      operationId: previewApartmentDeletion
      parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        '200':
          description: Предварительный просмотр без изменения данных
          content:
            application/json:
              schema:
                type: object
                required: [id, version, title, address, can_delete, confirmation_token, blockers, counts, has_history]
                properties:
                  id: {type: string}
                  version: {type: integer, minimum: 1}
                  title: {type: string}
                  address: {type: string}
                  can_delete: {type: boolean}
                  has_history: {type: boolean}
                  confirmation_token: {type: string, pattern: '^[0-9a-f]{64}$'}
                  blockers:
                    type: array
                    items:
                      type: object
                      properties:
                        code: {type: string, enum: [active_tenants, unsettled_finances]}
                        count: {type: integer}
                        message: {type: string}
                  counts:
                    type: object
                    properties:
                      rooms: {type: integer, minimum: 0}
                      leases: {type: integer, minimum: 0}
                      records: {type: integer, minimum: 0}
                      files: {type: integer, minimum: 0}
                      covers: {type: integer, minimum: 0}
                      recurring_rules: {type: integer, minimum: 0}
                      tenants: {type: integer, minimum: 0}
        default:
          description: Ошибка доступа, запроса или сервера
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/apartments/{id}/delete:
    post:
      summary: Удалить квартиру и её связанные данные после подтверждения
      operationId: deleteApartment
      description: Только собственник в режиме owner. Активные аренды с жильцами и незавершённые расчёты блокируют удаление. Изменение данных после предварительного просмотра возвращает 409. Повтор того же запроса с тем же ключом идемпотентен.
      parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
      - {in: header, name: X-Keys-Client, required: true, schema: {type: string, enum: [miniapp]}}
      - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 8, maxLength: 100}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, confirmation_token, confirmed]
              properties:
                version: {type: integer, minimum: 1}
                confirmation_token: {type: string, pattern: '^[0-9a-f]{64}$'}
                confirmed: {type: boolean, const: true}
      responses:
        '200':
          description: Квартира и метаданные удалены транзакционно. Физическая очистка файлов выполняется после COMMIT.
          content:
            application/json:
              schema:
                type: object
                required: [ok, id, deleted]
                properties:
                  ok: {type: boolean, const: true}
                  id: {type: string}
                  deleted: {type: boolean, const: true}
        '409':
          description: Состояние изменилось либо есть действующие жильцы или неурегулированные расчёты. Требуется повторный просмотр.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default:
          description: Ошибка подтверждения, запроса, доступа или сервера
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    CookieSession:
      type: apiKey
      in: cookie
      name: keys_session
    WebhookSecret:
      type: apiKey
      in: header
      name: X-Max-Bot-Api-Secret
  schemas:
    Error:
      type: object
      required:
      - error
      - requestId
      properties:
        error:
          type: string
        requestId:
          type: string
    State:
      type: object
      properties:
        user:
          type: object
          additionalProperties: true
        apartments:
          type: array
          items:
            type: object
            additionalProperties: true
        leases:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id: *id001
              unit_id: *id001
              unit_title: *id001
              tenant_id:
                type:
                - string
                - 'null'
                description: Совместимость; не источник прав доступа.
              tenant_ids:
                type: array
                items: *id001
              meters_enabled:
                type: integer
                enum:
                - 0
                - 1
              current_rent:
                type: integer
              current_terms: *id001
              current_due_day:
                type: integer
        records:
          type: array
          items:
            type: object
            additionalProperties: true
        meters:
          type: array
          items:
            type: object
            additionalProperties: true
        comments:
          type: array
          items:
            type: object
            additionalProperties: true
        events:
          type: array
          items:
            type: object
            additionalProperties: true
        notifications:
          type: array
          items:
            type: object
            additionalProperties: true
        people:
          type: array
          items:
            type: object
            additionalProperties: true
        files:
          type: array
          items:
            type: object
            additionalProperties: true
        server_time:
          type: string
          format: date-time
        business_date:
          type: string
          format: date
        timezone:
          type: string
        units:
          type: array
          items:
            type: object
            additionalProperties: true
        meter_history:
          type: array
          items:
            type: object
            additionalProperties: true
        recurring_rules:
          type: array
          items:
            type: object
            additionalProperties: true
    LeaseInput:
      type: object
      required:
      - start
      - end
      - rent
      - deposit
      - due_day
      - meter_day
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        rent:
          type: integer
          minimum: 1
          description: Копейки
        deposit:
          type: integer
          minimum: 0
        terms:
          type: string
          maxLength: 3000
        due_day:
          type: integer
          minimum: 1
          maximum: 31
        meter_day:
          type: integer
          minimum: 1
          maximum: 31
        unit_id:
          type: string
          description: ID целой квартиры либо комнаты этой квартиры. При пропуске выбирается whole.
        recurring_rent:
          type: boolean
          default: true
        meters_enabled:
          type: boolean
          default: true
    ApartmentInput:
      allOf:
      - $ref: '#/components/schemas/LeaseInput'
      - type: object
        required:
        - title
        - address
        - rooms
        - area
        properties:
          title:
            type: string
            maxLength: 80
          address:
            type: string
            maxLength: 250
          rooms:
            type: integer
            minimum: 1
            maximum: 20
          area:
            type: number
            minimum: 5
            maximum: 2000
          photo:
            enum:
            - living
            - owner
          cover_id:
            type:
            - string
            - 'null'
            description: id предварительно загруженной своей обложки; null — стандартная иллюстрация
          rental_mode:
            enum:
            - whole
            - rooms
            default: whole
          unit_title:
            type: string
            maxLength: 80
            description: Название первой комнаты при rental_mode=rooms.
    RecordInput:
      type: object
      required:
      - kind
      - lease_id
      - title
      - payload
      properties:
        kind:
          enum:
          - ticket
          - purchase
          - visit
          - charge
          - reading
          - document
          - expense
          - termination
          - terms
        lease_id:
          type: string
        title:
          type: string
          maxLength: 180
        payload:
          type: object
          additionalProperties: true
        files:
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            type: string
    ActionInput:
      type: object
      required:
      - action
      - version
      properties:
        action:
          enum:
          - start
          - resolve
          - confirm
          - reopen
          - cancel
          - approve
          - reject
          - compensate
          - accept
          - counter
          - complete
          - claim
          - record_payment
        version:
          type: integer
          minimum: 1
        note:
          type: string
        amount:
          type: integer
          minimum: 1
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        files:
          type: array
          maxItems: 5
          items:
            type: string
        claim_id:
          type: string
          description: ID конкретного перевода из payload.claims при confirm/reject платежа.
        payer_id:
          type: string
          description: Участник аренды для record_payment; нельзя указать жильца другой аренды.
    Record:
      allOf:
      - $ref: '#/components/schemas/RecordInput'
      - type: object
        properties:
          id:
            type: string
          status:
            type: string
          version:
            type: integer
          visibility:
            enum:
            - shared
            - owner
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
    DownloadTicket:
      type: object
      required:
      - url
      - name
      - mime
      properties:
        url:
          type: string
          format: uri
        name:
          type: string
        mime:
          type: string
    ApartmentUpdateInput:
      type: object
      required:
      - version
      properties:
        title:
          type: string
          maxLength: 80
        address:
          type: string
          maxLength: 250
        rooms:
          type: integer
          minimum: 1
          maximum: 20
        area:
          type: number
          minimum: 5
          maximum: 2000
        photo:
          enum:
          - living
          - owner
        cover_id:
          type:
          - string
          - 'null'
          description: id предварительно загруженной своей обложки; null — стандартная иллюстрация
        version:
          type: integer
          minimum: 1
        lease:
          allOf:
          - $ref: '#/components/schemas/LeaseInput'
          - type: object
            required:
            - id
            properties:
              id:
                type: string
          description: Только активный черновик без арендатора и записей
    UnitInput:
      type: object
      properties:
        kind:
          enum:
          - whole
          - room
          default: room
        title:
          type: string
          maxLength: 80
      required:
      - title
    UnitUpdateInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 80
        version: &id002
          type: integer
          minimum: 1
      required:
      - title
      - version
    MeterInput:
      type: object
      properties:
        label:
          type: string
          maxLength: 80
        kind:
          enum:
          - cold_water
          - hot_water
          - gas
          - electricity
          - heating
          - other
        unit:
          enum:
          - м³
          - кВт·ч
          - Гкал
          - МВт·ч
          - л
          - ед.
        scope:
          enum:
          - lease
          - apartment
          default: lease
        baseline:
          type: integer
          minimum: 0
          maximum: 1000000000000
        scheme:
          enum:
          - single
          - dual
          - triple
          default: single
      required:
      - label
    MeterUpdateInput:
      type: object
      properties:
        version: *id002
        label:
          type: string
          maxLength: 80
        baseline:
          type: integer
          minimum: 0
          maximum: 1000000000000
          description: Меняется только до первого показания; иначе создайте новый счётчик.
        active: *id003
      description: Укажите актуальную version. Для совместимости со старыми клиентами она необязательна; сервер
        всё равно проверяет права и историю.
    RecurringInput:
      type: object
      properties:
        lease_id: *id001
        title:
          type: string
          maxLength: 180
        amount:
          type: integer
          minimum: 1
        due_day:
          type: integer
          minimum: 1
          maximum: 31
        advance_days:
          type: integer
          minimum: 1
          maximum: 60
          default: 14
        start_month: &id004
          type: string
          pattern: ^\d{4}-\d{2}$
        end_month: *id004
      required:
      - lease_id
      - title
      - amount
      - due_day
    RecurringUpdateInput:
      type: object
      properties:
        version: *id002
        action:
          enum:
          - pause
          - resume
          - delete
          description: Для изменения условий поля action нет.
        effective_month: *id004
        title:
          type: string
          maxLength: 180
        amount:
          type: integer
          minimum: 1
        due_day:
          type: integer
          minimum: 1
          maximum: 31
        advance_days:
          type: integer
          minimum: 1
          maximum: 60
      required:
      - version
