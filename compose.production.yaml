# LEGACY CADDY EXAMPLE ONLY. For keys.udav.team use compose.prod.yml (NPM); see docs/DEPLOY.md.
# Use a DIFFERENT project name (-p keys-prod) so no demo volume is reused.
services:
  app:
    environment:
      APP_MODE: production
      TRUST_PROXY: "1"
    depends_on: []
  proxy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
